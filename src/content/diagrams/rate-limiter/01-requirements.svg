<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 909.9570178747481 126.53920823634803"><defs></defs><rect x="0" y="0" width="909.9570178747481" height="126.53920823634803" fill="#ffffff"></rect><g transform="translate(10 16.53920823634803) rotate(0 253 50)"><text x="0" y="17.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Functional Requirements</text> <text x="0" y="42.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- identify users by id, ip, or api key</text> <text x="0" y="67.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- limit requests based on configurable rules</text> <text x="0" y="92.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- return proper error headers and status codes</text></g> <g transform="translate(580.9570178747482 10) rotate(0 159.49999999999994 50)"><text x="0" y="17.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Non-functional Requirements</text> <text x="0" y="42.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- low latency check (&lt; 10ms)</text> <text x="0" y="67.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- availability &gt;&gt; consistency</text> <text x="0" y="92.5" font-family="Comic Shanns, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- scale to 1M rps</text></g></svg>